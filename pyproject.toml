[project]
name = "shelfrank"
version = "0.1.0"
description = "Query understanding and learning-to-rank for home-goods search, evaluated on WANDS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Rohit Kumar" }]
license = { text = "MIT" }
# Versions are pinned to wheels verified to load on the development machine, where
# Windows Smart App Control rejects some newer compiled wheels. See docs/ENVIRONMENT.md.
dependencies = [
    "bm25s==0.2.6",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pydantic>=2.9.2,<3",
    "pyyaml==6.0.2",
    "scipy==1.13.1",
]

[project.optional-dependencies]
dev = [
    "lightgbm==4.5.0",
    "pyarrow==17.0.0",
    "pytest==8.3.3",
    "ranx==0.3.20",
    "ruff==0.7.4",
    "scikit-learn==1.5.1",
]
bench = [
    "google-genai==3.6.1",
    "lightgbm==4.5.0",
    "python-dotenv>=1.0,<2",
    "scikit-learn==1.5.1",
    "sentence-transformers==3.2.1",
    "torch==2.4.1",
    "transformers==4.45.2",
]
app = [
    "duckdb==1.1.3",
    "lightgbm==4.5.0",
    "onnxruntime==1.19.2",
    "pyarrow==17.0.0",
    "scikit-learn==1.5.1",
    "streamlit==1.39.0",
    "tokenizers==0.20.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelfrank"]

# CPU wheels everywhere: there is no local GPU, and the default Linux wheel pulls in CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
markers = ["full_data: needs the downloaded WANDS files; skipped when they are absent"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D1", "ANN"]
ignore = ["ANN101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1", "ANN", "F811"]
"tests/test_seed_selection.py" = ["D1", "ANN", "E501"]
"scripts/*" = ["E501"]
# Markdown template lines
"shelfrank/data/audit_report.py" = ["E501"]
"shelfrank/eval/retrieval_report.py" = ["E501"]
"shelfrank/eval/dense_report.py" = ["E501"]
"shelfrank/dense/checks_report.py" = ["E501"]
"shelfrank/qu/seed_notebook.py" = ["E501"]
"shelfrank/readme_tables.py" = ["E501"]
