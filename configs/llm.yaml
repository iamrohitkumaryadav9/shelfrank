# Read from Google's documentation on the date below. Prices are USD per 1M tokens, paid tier,
# standard mode. Output price includes thinking tokens.
checked: 2026-11-25
sources:
  pricing: https://ai.google.dev/gemini-api/docs/pricing
  models: https://ai.google.dev/gemini-api/docs/models
  thinking: https://ai.google.dev/gemini-api/docs/thinking
  deprecations: https://ai.google.dev/gemini-api/docs/deprecations

model: gemini-3.1-flash-lite
models:
  gemini-3.1-flash-lite:
    input: 0.25
    output: 1.50
    thinking_level: minimal   # the lowest level listed; the page lists no way to disable it
    earliest_shutdown: 2027-05-07
  gemini-2.5-flash-lite:
    # Cheaper, but Google limits access to users who already used the 2.5 models.
    input: 0.10
    output: 0.40
    thinking_level: "off"     # the default listed for this model
    earliest_shutdown: null
  gemini-3.5-flash-lite:
    input: 0.30
    output: 2.50
    thinking_level: minimal
    earliest_shutdown: null

currency:
  inr_per_usd: 92.92          # ECB reference rate of 2026-11-24, via frankfurter.dev
  # The docs state no tax or card margin. Caps are enforced as if both applied: 18% GST, 5% margin.
  safety_factor: 1.24

# The absolute limit of Rs 500 is a constant in shelfrank/llm/budget.py and cannot be changed here.
caps_inr:
  smoke: 1
  labelling: 100
  rewriting: 200
  total: 300

# One entry per approved batch, added only after Rohit's explicit yes.
approvals:
  - {batch: smoke, max_inr: 1, date: 2026-11-25}
  - {batch: class_esci_dev_class-v1, max_inr: 3, date: 2026-11-25}
  - {batch: slots_esci_dev_slots-v1, max_inr: 3, date: 2026-11-25}
  - {batch: slots_wands_dev_slots-v1, max_inr: 1, date: 2026-11-25}
  - {batch: class_esci_seed_class-v1, max_inr: 18, date: 2026-11-26}
  # Under the standing approval of 2026-11-26 (docs/PROTOCOL.md section 14): Rs per item projected, then piloted.
  - {batch: slots_esci_seed_slots-v1, max_inr: 23, date: 2026-11-26, basis: {projected: 0.00946, pilot: 0.00952}}
  # max 2 and not 1: the worst case reserved before each call needs more room than the Rs 0.80 projection.
  - {batch: class_wands_dev_class-v1, max_inr: 2, date: 2026-11-26, basis: {projected: 0.00803, pilot: 0.00801}}

# Use of the Rs 200 between the planned total and the absolute limit. Same rule.
buffer_approvals: []
