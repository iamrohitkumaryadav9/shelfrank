run_depth: 1000        # MRR is therefore measured within the top 1000
candidate_depth: 100   # per generator

bm25:
  # Lucene defaults, not tuned. Only field weights are tuned, on the dev fold.
  k1: 1.2
  b: 0.75
  tuning:
    anchor: name       # fixed at 1, because only the ratio between weights matters
    grid: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0, 4.0]
    min_gain: 0.0005   # ignore gains too small to be anything but noise
    inner_folds: 4
    seed: 20260

dense:
  bge_small:
    model: BAAI/bge-small-en-v1.5
    revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
    max_seq_length: 128
    # Instruction from the model card, for queries only.
    query_prefix: "Represent this sentence for searching relevant passages: "

rrf:
  k: 60                # published default, not tuned; frozen at Gate 1

bootstrap:
  n_resamples: 10000
  seed: 20260
