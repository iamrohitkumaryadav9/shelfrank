name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Tests read only the committed fixture; full_data tests skip without the raw files.
      - run: uv run pytest
      - run: uv run python scripts/reproduce.py --offline --fixture

  # Streamlit Community Cloud installs from uv.lock without extras, on Debian bullseye with Python 3.12,
  # after packages.txt. This job does the same in a clean container and starts the demo on the real files.
  streamlit-cloud:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bullseye
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && xargs -a packages.txt apt-get install -y --no-install-recommends
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run --no-sync python -c "import duckdb, lightgbm, onnxruntime, tokenizers, streamlit"
      - run: uv run --no-sync python scripts/smoke_app.py
